services:
  app:
    build: .
    ports:
      - "${PORT:-8089}:8089"
    environment:
      PORT: 8089
      TLS_CERT_PATH: /certs/server.pem
      TLS_KEY_PATH: /certs/server-key.pem
      DATA_DIR: /data
      CSV_DIR: /data
      HD_HEADLESS: "1"
      JEV_API_KEY: ${JEV_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
      - ${CSV_DIR:-./data}:/csvs:ro
    restart: unless-stopped
