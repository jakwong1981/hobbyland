services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATA_DIR: /data
      CSV_DIR: /data
      HD_HEADLESS: "1"
      JEV_API_KEY: ${JEV_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./data:/data
      - ${CSV_DIR:-./data}:/csvs:ro
    restart: unless-stopped
